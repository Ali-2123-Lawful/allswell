# Tool configuration only. The app runs from source; see README "Quick start".

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, warnings, import order

[tool.ruff.lint.isort]
known-first-party = ["backend", "packages"]
